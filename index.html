<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fact Find Request</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--fg:#1d2a26;--muted:#5c6b66;--line:#d9e1de;--accent:#1f6f5c}
@media (prefers-color-scheme:dark){:root{--bg:#141a18;--card:#1c2421;--fg:#e6eeeb;--muted:#9aaba5;--line:#2e3a36;--accent:#4fb89b;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:min(440px,calc(100vw - 32px));box-sizing:border-box;display:grid;gap:14px}
h1{margin:0;font-size:1.4rem}p{margin:0;color:var(--muted)}
input{font:inherit;font-size:1.1rem;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
button{font:inherit;font-weight:700;font-size:1.05rem;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
#ok{color:var(--accent);font-weight:600;min-height:1.4em}
</style></head><body>
<form class="card" id="f">
<h1>Fact find request</h1>
<p>Type the client's name and press Send. It emails Mason, and the fact find gets filled on the CRM.</p>
<input id="n" placeholder="e.g. John Doe" autocomplete="off" required autofocus>
<button>Send</button>
<div id="ok" role="status"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit',e=>{
  e.preventDefault(); const n=document.getElementById('n').value.trim(); if(!n) return;
  location.href='mailto:mason@needingadvice.co.uk?subject='+encodeURIComponent('FILL IN FF: '+n)+'&body='+encodeURIComponent('Please fill in the fact find for '+n+'.\n\n(Add any notes here if you like.)');
  document.getElementById('ok').textContent='Your email has opened — just press Send in it.';
  document.getElementById('n').value='';
});
</script></body></html>
